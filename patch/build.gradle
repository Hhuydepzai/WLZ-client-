plugins { id 'com.android.application' }

android {
    namespace 'com.wlz.client'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wlzclient.launcher'
        minSdk 26
        targetSdk 35
        versionCode 243
        versionName '2.4.3'
    }

    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled false
            ndk { debugSymbolLevel 'none' }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}
