plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wlz.client'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wlzclient.launcher'
        minSdk 26
        targetSdk 35
        versionCode 250
        versionName '2.5.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}
