name: Build WLZ Standalone Launcher

concurrency:
  group: wlz-standalone-build
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate patch sources
        run: python3 -m py_compile patch/apply.py

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -q app.zip
          unzip -q tools.zip

      - name: Apply standalone launcher patch
        run: python3 patch/apply.py

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build standalone WLZ APK
        run: |
          set -euo pipefail
          gradle clean assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Validate launcher APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -tq "$APK"
          BT="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          AAPT2="$ANDROID_HOME/build-tools/$BT/aapt2"
          APKSIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"
          "$APKSIGNER" verify --verbose "$APK"
          BADGING="$("$AAPT2" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -q "package: name='com.wlzclient.launcher'"
          printf '%s\n' "$BADGING" | tee app/build/outputs/apk/debug/aapt-badging.txt
          unzip -Z1 "$APK" | grep -qx 'AndroidManifest.xml'
          unzip -Z1 "$APK" | grep -q '^classes.dex$'
          echo "Validated: standalone Android launcher; Minecraft runtime is not embedded."

      - name: Prepare downloadable APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/WLZ-Launcher-2.5.0.apk
          sha256sum dist/WLZ-Launcher-2.5.0.apk | tee dist/SHA256SUMS.txt
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WLZ-Launcher-2.5.0
          path: dist/WLZ-Launcher-2.5.0.apk
          if-no-files-found: error

      - name: Publish direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v2.5.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/WLZ-Launcher-2.5.0.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/WLZ-Launcher-2.5.0.apk dist/SHA256SUMS.txt \
              --title "WLZ Launcher 2.5.0" \
              --notes "Standalone WLZ launcher. Detects and opens an installed Minecraft Bedrock package; it does not bundle the Minecraft runtime."
          fi
