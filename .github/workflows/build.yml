name: Build WLZ Client

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q app.zip
          unzip -q tools.zip

      - name: Apply WLZ patch
        run: |
          cp patch/OverlayService.java app/src/main/java/com/wlz/client/OverlayService.java
          cp patch/wlz_icon.xml app/src/main/res/drawable/wlz_icon.xml
          cp patch/wlz_splash.xml app/src/main/res/drawable/wlz_splash.xml
          python3 patch/apply.py

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WLZ-Client-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
