name: Build WLZ Client

concurrency:
  group: wlz-build
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q app.zip
          unzip -q tools.zip

      - name: Download Minecraft runtime from repository release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p minecraft_input

          # The four runtime parts are stored in the draft repository release.
          release_id="405413956"
          echo "Using Minecraft runtime release id: ${release_id}"

          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100"             --paginate             --jq '.[] | [.name, .url] | @tsv' |
          while IFS=$'\t' read -r name api_url; do
            case "${name}" in
              AndroidManifest.xml|arm64-v8a.zip|dex.zip|libminecraftpe.so)
                echo "Downloading ${name}"
                curl -fL --retry 4 --retry-delay 2                   -H "Authorization: Bearer ${GH_TOKEN}"                   -H "Accept: application/octet-stream"                   -H "X-GitHub-Api-Version: 2022-11-28"                   "${api_url}"                   -o "minecraft_input/${name}"
                test -s "minecraft_input/${name}"
                echo "${name}: $(stat -c '%s' "minecraft_input/${name}") bytes"
                ;;
            esac
          done

          test -s minecraft_input/AndroidManifest.xml
          test -s minecraft_input/arm64-v8a.zip
          test -s minecraft_input/dex.zip
          test -s minecraft_input/libminecraftpe.so

          unzip -tq minecraft_input/arm64-v8a.zip
          unzip -tq minecraft_input/dex.zip

      - name: Apply WLZ patch
        run: |
          python3 patch/apply.py

      - name: Remove obsolete Snaplook references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/cpp/wlzclient.cpp")
          s = p.read_text()
          s = s.replace("void doSnapNow() {\\n    if (g_modules[7].load() && g_lastPlayer) {\\n        snapPlayer(g_lastPlayer);\\n        g_snapPending.store(false);\\n    }\\n}\\n\\n", "")
          s = s.replace("    applyFullbright();\\n    doSnapNow();\\n}", "    applyFullbright();\\n}")
          s = s.replace("    if (index==7 && on) {\\n        g_snapPending.store(true);\\n        doSnapNow();\\n    }\\n    if (index==4) applyFullbright();", "    // Snaplook index 7 is not part of the current Apollon port.\\n    if (index==4) applyFullbright();")
          p.write_text(s)
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build WLZ helper
        run: |
          gradle assembleDebug --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Setup Android SDK build tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;35.0.0 platforms;android-35'

      - name: Setup Java 8 for ManifestEditor
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Build current ManifestEditor
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 \
            https://github.com/WindySha/ManifestEditor/archive/refs/heads/master.zip \
            -o manifest-editor.zip
          rm -rf manifest-editor ManifestEditor-master
          unzip -q manifest-editor.zip
          mv ManifestEditor-master manifest-editor
          chmod +x manifest-editor/gradlew
          ./manifest-editor/gradlew -p manifest-editor :lib:jar --no-daemon --stacktrace
          MANIFEST_EDITOR="$(find manifest-editor/lib/build/libs -maxdepth 1 -type f -name 'ManifestEditor*.jar' -print -quit)"
          test -s "$MANIFEST_EDITOR"
          MANIFEST_HELP="$(java -jar "$MANIFEST_EDITOR" -h 2>&1 || true)"
          printf '%s\n' "$MANIFEST_HELP" | grep -q -- '--activity'
          cp "$MANIFEST_EDITOR" ManifestEditor.jar
          test -s ManifestEditor.jar

      - name: Setup Java 17 for final packaging
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare embedded Minecraft build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          python3 patch/embed_minecraft.py             --input minecraft_input             --wlz-apk app/build/outputs/apk/debug/app-debug.apk             --manifest-editor ManifestEditor.jar             --out dist/WLZ-Minecraft-unsigned.apk

          BT="$(ls -1 "${ANDROID_HOME}/build-tools" | sort -V | tail -n 1)"
          ZIPALIGN="${ANDROID_HOME}/build-tools/${BT}/zipalign"
          APKSIGNER="${ANDROID_HOME}/build-tools/${BT}/apksigner"

          "${ZIPALIGN}" -P 16 -f             dist/WLZ-Minecraft-unsigned.apk             dist/WLZ-Minecraft-aligned.apk

          keytool -genkeypair -v             -keystore dist/wlz-ci.jks             -storepass wlzclient             -keypass wlzclient             -alias wlz             -keyalg RSA -keysize 2048 -validity 10000             -dname "CN=WLZ Client,O=WLZ"

          "${APKSIGNER}" sign             --ks dist/wlz-ci.jks             --ks-pass pass:wlzclient             --key-pass pass:wlzclient             --out dist/WLZ-Minecraft.apk             dist/WLZ-Minecraft-aligned.apk

          "${APKSIGNER}" verify --verbose dist/WLZ-Minecraft.apk

          # Verify the final package is WLZ, not com.mojang.minecraftpe.
          AAPT2="${ANDROID_HOME}/build-tools/${BT}/aapt2"
          BADGING="$("${AAPT2}" dump badging dist/WLZ-Minecraft.apk)"
          printf '%s\n' "$BADGING" | grep -q "package: name='com.wlz.client'"
          test -s dist/WLZ-Minecraft.apk

      - name: Show artifacts
        run: find dist -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WLZ-Minecraft-APK
          path: dist/WLZ-Minecraft.apk
          if-no-files-found: error
