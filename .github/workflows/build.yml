name: Build WLZ Client v3

concurrency:
  group: wlz-build
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q app.zip
          unzip -q tools.zip

      - name: Apply WLZ patch
        run: |
          mkdir -p app/src/main/res/drawable
          cp patch/OverlayService.java app/src/main/java/com/wlz/client/OverlayService.java
          cp patch/wlz_icon.xml app/src/main/res/drawable/wlz_icon.xml
          cp patch/wlz_splash.xml app/src/main/res/drawable/wlz_splash.xml
          python3 patch/apply.py

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build WLZ runtime helper
        run: |
          gradle assembleDebug --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Build single-APK WLZ Minecraft client
        id: embed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          INPUT_FOUND=0
          if [ -d minecraft_input ]; then
            if find minecraft_input -type f \\( -name '*.apk' -o -name '*.zip' \\) -print -quit | grep -q .; then
              INPUT_FOUND=1
            fi
          fi

          if [ "$INPUT_FOUND" -eq 1 ]; then
            echo "embedded=true" >> "$GITHUB_OUTPUT"

            APKTOOL_URL="$(curl -fsSL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url' | head -n 1)"
            test -n "$APKTOOL_URL"
            curl -fL "$APKTOOL_URL" -o apktool.jar

            python3 patch/embed_minecraft.py \
              --input minecraft_input \
              --wlz-apk app/build/outputs/apk/debug/app-debug.apk \
              --apktool apktool.jar \
              --out dist/WLZ-Minecraft-unsigned.apk

            BT="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
            ZIPALIGN="$ANDROID_HOME/build-tools/$BT/zipalign"
            APKSIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"
            test -x "$ZIPALIGN"
            test -x "$APKSIGNER"

            "$ZIPALIGN" -f -p 4 \
              dist/WLZ-Minecraft-unsigned.apk \
              dist/WLZ-Minecraft-aligned.apk

            keytool -genkeypair -v \
              -keystore dist/wlz-ci.jks \
              -storepass wlzclient \
              -keypass wlzclient \
              -alias wlz \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=WLZ Client,O=WLZ"

            "$APKSIGNER" sign \
              --ks dist/wlz-ci.jks \
              --ks-pass pass:wlzclient \
              --key-pass pass:wlzclient \
              --out dist/WLZ-Minecraft.apk \
              dist/WLZ-Minecraft-aligned.apk

            "$APKSIGNER" verify --verbose dist/WLZ-Minecraft.apk
          else
            echo "embedded=false" >> "$GITHUB_OUTPUT"
            cp app/build/outputs/apk/debug/app-debug.apk dist/WLZ-Client-helper.apk
          fi

      - name: Show artifacts
        run: |
          find dist -maxdepth 1 -type f -printf '%f %s bytes\\n' | sort

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WLZ-Client-APK
          path: |
            dist/*.apk
          if-no-files-found: error
