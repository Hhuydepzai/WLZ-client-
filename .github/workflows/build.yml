name: Build WLZ Standalone Launcher

concurrency:
  group: wlz-launcher-build
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;35.0.0 platforms;android-35'

      - name: Extract project
        run: |
          unzip -q app.zip
          unzip -q tools.zip

      - name: Apply standalone launcher patch
        run: |
          set -euo pipefail
          python3 -m py_compile patch/apply.py patch/embed_minecraft.py patch/branding_and_runtime.py
          python3 patch/apply.py

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build standalone WLZ launcher
        run: |
          set -euo pipefail
          gradle assembleDebug --stacktrace
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BT="$(ls -1 "${ANDROID_HOME}/build-tools" | sort -V | tail -n 1)"
          AAPT2="${ANDROID_HOME}/build-tools/${BT}/aapt2"
          APKSIGNER="${ANDROID_HOME}/build-tools/${BT}/apksigner"
          ZIPALIGN="${ANDROID_HOME}/build-tools/${BT}/zipalign"

          "${APKSIGNER}" verify --verbose "$APK"
          BADGING="$("${AAPT2}" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -q "package: name='com.wlzclient.launcher'"
          printf '%s\n' "$BADGING" | tee app-badging.txt
          "${AAPT2}" dump xmltree "$APK" --file AndroidManifest.xml > manifest-tree.txt
          grep -q 'com.mojang.minecraftpe' manifest-tree.txt
          grep -q 'com.mojang.minecraftpe.preview' manifest-tree.txt
          grep -q 'com.wlz.client.MainActivity' manifest-tree.txt
          if grep -q 'com.mojang.minecraftpe.MainActivity' manifest-tree.txt; then
            echo "Standalone launcher must not declare an embedded Minecraft Activity."
            exit 1
          fi
          unzip -tq "$APK"

          mkdir -p dist
          cp "$APK" dist/WLZ-Launcher-2.5.0.apk
          unzip -tq dist/WLZ-Launcher-2.5.0.apk
          sha256sum dist/WLZ-Launcher-2.5.0.apk | tee dist/SHA256SUMS.txt
          echo "Built standalone launcher; no Minecraft base APK is embedded."

      - name: Upload installable launcher
        uses: actions/upload-artifact@v4
        with:
          name: WLZ-Launcher-2.5.0-APK
          path: dist/WLZ-Launcher-2.5.0.apk
          if-no-files-found: error

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v2.5.0-launcher"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/WLZ-Launcher-2.5.0.apk --clobber
          else
            gh release create "$TAG" dist/WLZ-Launcher-2.5.0.apk \
              --title "WLZ Launcher 2.5.0" \
              --notes "Standalone WLZ launcher. Opens an existing Minecraft Bedrock installation; it does not bundle Minecraft. The external-app sandbox means in-process HUD/native modules are not injected into another app."
          fi
