name: Build WLZ Client

concurrency:
  group: wlz-build
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate build scripts
        run: python3 -m py_compile patch/apply.py patch/embed_minecraft.py

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q app.zip
          unzip -q tools.zip

      - name: Apply WLZ patch
        run: python3 patch/apply.py

      - name: Remove obsolete Snaplook references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/cpp/wlzclient.cpp")
          s = p.read_text()
          s = s.replace("void doSnapNow() {\n    if (g_modules[7].load() && g_lastPlayer) {\n        snapPlayer(g_lastPlayer);\n        g_snapPending.store(false);\n    }\n}\n\n", "")
          s = s.replace("    applyFullbright();\n    doSnapNow();\n}", "    applyFullbright();\n}")
          s = s.replace("    if (index==7 && on) {\n        g_snapPending.store(true);\n        doSnapNow();\n    }\n    if (index==4) applyFullbright();", "    // Snaplook index 7 is not part of the current Apollon port.\n    if (index==4) applyFullbright();")
          p.write_text(s)
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build WLZ helper
        run: |
          gradle assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload WLZ helper APK
        uses: actions/upload-artifact@v4
        with:
          name: WLZ-Helper-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Download complete Minecraft base APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p minecraft_input
          release_id="405413956"

          # Prefer a pinned asset provided by this repo's release. Older releases
          # only contain manifest/Dex/native fragments, which are not a complete APK.
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            --paginate --jq '.[] | [.name, .url] | @tsv' > /tmp/wlz-release-assets.tsv
          BASE_LINE="$(awk -F '\t' '$1 == "base.apk" || $1 == "Minecraft-base.apk" || $1 == "Minecraft.apk" || $1 == "minecraft-full.apk" || $1 ~ /^Apollon.*\.apk$/ {print; exit}' /tmp/wlz-release-assets.tsv)"

          if [ -n "${BASE_LINE}" ]; then
            IFS=$'\t' read -r name api_url <<< "${BASE_LINE}"
            echo "Downloading full Minecraft base asset from release: ${name}"
            curl -fL --retry 4 --retry-delay 2 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api_url}" -o minecraft_input/base.apk
          else
            # Source matching the user-provided Apollon V6.6 64-bit / MCPE 26.51 build.
            # Never package blindly: the validation below rejects interstitial HTML,
            # split APKs, or incomplete runtime downloads.
            SOURCE_URL="${APOLLON_V66_ARM64_URL:-https://go.linkify.ru/2Jri}"
            echo "No complete APK in Release; trying the published Apollon V6.6 ARM64 source."
            curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
              --connect-timeout 30 --max-time 1800 \
              --user-agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128 Safari/537.36" \
              "${SOURCE_URL}" -o minecraft_input/base.apk
          fi

          test -s minecraft_input/base.apk
          file minecraft_input/base.apk
          sha256sum minecraft_input/base.apk | tee minecraft_input/base.sha256
          unzip -tq minecraft_input/base.apk

          python3 - <<'PY'
          import re, zipfile
          p = "minecraft_input/base.apk"
          with zipfile.ZipFile(p) as z:
              names = set(z.namelist())
          required = ["AndroidManifest.xml", "resources.arsc", "lib/arm64-v8a/libminecraftpe.so"]
          missing = [x for x in required if x not in names]
          if not any(n.startswith("assets/") for n in names):
              missing.append("assets/*")
          if not any(re.fullmatch(r"classes[0-9]*\\.dex", n) for n in names):
              missing.append("classes*.dex")
          if missing:
              raise SystemExit("Source APK is incomplete or not an APK; missing: " + ", ".join(missing))
          print(f"Source APK validated: {len(names)} entries, manifest, resources.arsc, assets, DEX and ARM64 runtime found.")
          PY

      - name: Setup Android SDK build tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;35.0.0 platforms;android-35'

      - name: Setup Java 17 for final packaging
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare embedded Minecraft build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 patch/embed_minecraft.py --input minecraft_input --wlz-apk app/build/outputs/apk/debug/app-debug.apk --out dist/WLZ-Minecraft-unsigned.apk

          BT="$(ls -1 "${ANDROID_HOME}/build-tools" | sort -V | tail -n 1)"
          ZIPALIGN="${ANDROID_HOME}/build-tools/${BT}/zipalign"
          APKSIGNER="${ANDROID_HOME}/build-tools/${BT}/apksigner"
          AAPT2="${ANDROID_HOME}/build-tools/${BT}/aapt2"

          "${ZIPALIGN}" -P 16 -f 4 dist/WLZ-Minecraft-unsigned.apk dist/WLZ-Minecraft-aligned.apk
          keytool -genkeypair -v \
            -keystore dist/wlz-ci.jks -storepass wlzclient -keypass wlzclient \
            -alias wlz -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=WLZ Client,O=WLZ"
          "${APKSIGNER}" sign --ks dist/wlz-ci.jks --ks-pass pass:wlzclient \
            --key-pass pass:wlzclient --out dist/WLZ-Client-2.3.5.apk \
            dist/WLZ-Minecraft-aligned.apk
          "${APKSIGNER}" verify --verbose dist/WLZ-Client-2.3.5.apk

          BADGING="$("${AAPT2}" dump badging dist/WLZ-Client-2.3.5.apk)"
          printf '%s\n' "$BADGING" | grep -q "package: name='com.wlzclient.launcher'"
          unzip -tq dist/WLZ-Client-2.3.5.apk
          unzip -Z1 dist/WLZ-Client-2.3.5.apk | grep -q '^assets/'
          unzip -Z1 dist/WLZ-Client-2.3.5.apk | grep -qx 'resources.arsc'
          unzip -Z1 dist/WLZ-Client-2.3.5.apk | grep -qx 'lib/arm64-v8a/libminecraftpe.so'
          test -s dist/WLZ-Client-2.3.5.apk
          sha256sum dist/WLZ-Client-2.3.5.apk | tee dist/SHA256SUMS.txt

      - name: Show artifacts
        run: find dist -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WLZ-Client-2.3.5-APK
          path: |
            dist/WLZ-Client-2.3.5.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
