name: Build WLZ Client

concurrency:
  group: wlz-build
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate build scripts
        run: python3 -m py_compile patch/apply.py patch/embed_minecraft.py

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q app.zip
          unzip -q tools.zip

      - name: Apply WLZ patch
        run: |
          python3 patch/apply.py

      - name: Remove obsolete Snaplook references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/cpp/wlzclient.cpp")
          s = p.read_text()
          s = s.replace("void doSnapNow() {\n    if (g_modules[7].load() && g_lastPlayer) {\n        snapPlayer(g_lastPlayer);\n        g_snapPending.store(false);\n    }\n}\n\n", "")
          s = s.replace("    applyFullbright();\n    doSnapNow();\n}", "    applyFullbright();\n}")
          s = s.replace("    if (index==7 && on) {\n        g_snapPending.store(true);\n        doSnapNow();\n    }\n    if (index==4) applyFullbright();", "    // Snaplook index 7 is not part of the current Apollon port.\n    if (index==4) applyFullbright();")
          p.write_text(s)
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build WLZ helper
        run: |
          gradle assembleDebug --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload WLZ helper APK
        uses: actions/upload-artifact@v4
        with:
          name: WLZ-Helper-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Download complete Minecraft base APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p minecraft_input

          release_id="405413956"
          echo "Looking for a complete Minecraft source APK in runtime release ${release_id}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            --paginate --jq '.[] | [.name, .url] | @tsv' > /tmp/wlz-release-assets.tsv

          # The previous four-file bundle included only manifest, DEX and native
          # libraries. It omitted assets/ and resources.arsc, so Minecraft crashed
          # or displayed a gray screen even if Android accepted the APK.
          BASE_LINE="$(awk -F '\t' '$1 == "base.apk" || $1 == "Minecraft-base.apk" || $1 == "Minecraft.apk" || $1 == "minecraft-full.apk" || $1 ~ /^Apollon.*\.apk$/ {print; exit}' /tmp/wlz-release-assets.tsv)"
          if [ -z "${BASE_LINE}" ]; then
            echo "::error::No complete source APK is attached to release ${release_id}."
            echo "::error::Upload the matching full base APK as base.apk (or Minecraft-base.apk / Apollon*.apk). DEX + .so files alone are not enough."
            exit 1
          fi

          IFS=$'\t' read -r name api_url <<< "${BASE_LINE}"
          echo "Downloading complete runtime: ${name}"
          curl -fL --retry 4 --retry-delay 2 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api_url}" -o minecraft_input/base.apk
          test -s minecraft_input/base.apk
          unzip -tq minecraft_input/base.apk

          python3 - <<'PY'
          import zipfile
          p = "minecraft_input/base.apk"
          with zipfile.ZipFile(p) as z:
              names = set(z.namelist())
          required = ["AndroidManifest.xml", "resources.arsc", "lib/arm64-v8a/libminecraftpe.so"]
          missing = [x for x in required if x not in names]
          if not any(x.startswith("assets/") for x in names):
              missing.append("assets/*")
          if not any(x.startswith("classes") and x.endswith(".dex") for x in names):
              missing.append("classes*.dex")
          if missing:
              raise SystemExit("Source APK is incomplete; missing: " + ", ".join(missing))
          print("Source APK validated: manifest, resource table, assets, DEX and ARM64 runtime found.")
          PY

      - name: Setup Android SDK build tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;35.0.0 platforms;android-35'

      - name: Setup Java 17 for final packaging
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare embedded Minecraft build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          python3 patch/embed_minecraft.py --input minecraft_input --wlz-apk app/build/outputs/apk/debug/app-debug.apk --out dist/WLZ-Minecraft-unsigned.apk

          BT="$(ls -1 "${ANDROID_HOME}/build-tools" | sort -V | tail -n 1)"
          ZIPALIGN="${ANDROID_HOME}/build-tools/${BT}/zipalign"
          APKSIGNER="${ANDROID_HOME}/build-tools/${BT}/apksigner"

          "${ZIPALIGN}" -P 16 -f 4             dist/WLZ-Minecraft-unsigned.apk             dist/WLZ-Minecraft-aligned.apk

          keytool -genkeypair -v             -keystore dist/wlz-ci.jks             -storepass wlzclient             -keypass wlzclient             -alias wlz             -keyalg RSA -keysize 2048 -validity 10000             -dname "CN=WLZ Client,O=WLZ"

          "${APKSIGNER}" sign             --ks dist/wlz-ci.jks             --ks-pass pass:wlzclient             --key-pass pass:wlzclient             --out dist/WLZ-Minecraft.apk             dist/WLZ-Minecraft-aligned.apk

          "${APKSIGNER}" verify --verbose dist/WLZ-Minecraft.apk

          # Verify independent package identity and full game payload.
          AAPT2="${ANDROID_HOME}/build-tools/${BT}/aapt2"
          BADGING="$("${AAPT2}" dump badging dist/WLZ-Minecraft.apk)"
          printf '%s\n' "$BADGING" | grep -q "package: name='com.wlzclient.launcher'"
          unzip -tq dist/WLZ-Minecraft.apk
          unzip -Z1 dist/WLZ-Minecraft.apk | grep -q '^assets/'
          unzip -Z1 dist/WLZ-Minecraft.apk | grep -qx 'resources.arsc'
          unzip -Z1 dist/WLZ-Minecraft.apk | grep -qx 'lib/arm64-v8a/libminecraftpe.so'
          test -s dist/WLZ-Minecraft.apk

      - name: Show artifacts
        run: find dist -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WLZ-Minecraft-APK
          path: dist/WLZ-Minecraft.apk
          if-no-files-found: error
