name: Build WLZ Client

concurrency:
  group: wlz-build
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      minecraft_manifest_url:
        description: "Direct URL to AndroidManifest.xml"
        required: true
        type: string
      minecraft_arm64_url:
        description: "Direct URL to arm64-v8a.zip"
        required: true
        type: string
      minecraft_dex_url:
        description: "Direct URL to dex.zip"
        required: true
        type: string
      minecraft_lib_url:
        description: "Direct URL to libminecraftpe.so"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q app.zip
          unzip -q tools.zip

      - name: Download four Minecraft runtime parts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p minecraft_input

          download() {
            local name="$1"
            local url="$2"
            case "$url" in
              https://*|http://*) ;;
              *) echo "$name must be a direct http(s) URL"; exit 1 ;;
            esac
            echo "Downloading $name"
            curl -fL --retry 4 --retry-delay 2 "$url" -o "minecraft_input/$name"
            test -s "minecraft_input/$name"
            echo "$name: $(stat -c '%s' "minecraft_input/$name") bytes"
          }

          download AndroidManifest.xml "${{ inputs.minecraft_manifest_url }}"
          download arm64-v8a.zip "${{ inputs.minecraft_arm64_url }}"
          download dex.zip "${{ inputs.minecraft_dex_url }}"
          download libminecraftpe.so "${{ inputs.minecraft_lib_url }}"

          file minecraft_input/AndroidManifest.xml
          file minecraft_input/arm64-v8a.zip
          file minecraft_input/dex.zip
          file minecraft_input/libminecraftpe.so

          unzip -tq minecraft_input/arm64-v8a.zip
          unzip -tq minecraft_input/dex.zip

          if ! grep -a -q "com.mojang.minecraftpe.MainActivity" minecraft_input/AndroidManifest.xml; then
            echo "AndroidManifest.xml does not contain com.mojang.minecraftpe.MainActivity"
            exit 1
          fi

          if ! grep -a -q "classes" minecraft_input/dex.zip; then
            echo "dex.zip does not appear to contain classes*.dex"
            exit 1
          fi

          echo "Minecraft runtime parts validated."

      - name: Apply WLZ patch
        run: |
          python3 patch/apply.py

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build WLZ helper
        run: |
          gradle assembleDebug --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare embedded Minecraft build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          APKTOOL_URL="$(curl -fsSL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url' | head -n 1)"
          test -n "$APKTOOL_URL"
          curl -fL "$APKTOOL_URL" -o apktool.jar

          python3 patch/embed_minecraft.py             --input minecraft_input             --wlz-apk app/build/outputs/apk/debug/app-debug.apk             --apktool apktool.jar             --out dist/WLZ-Minecraft-unsigned.apk

          BT="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BT/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"

          "$ZIPALIGN" -f -p 4             dist/WLZ-Minecraft-unsigned.apk             dist/WLZ-Minecraft-aligned.apk

          keytool -genkeypair -v             -keystore dist/wlz-ci.jks             -storepass wlzclient             -keypass wlzclient             -alias wlz             -keyalg RSA -keysize 2048 -validity 10000             -dname "CN=WLZ Client,O=WLZ"

          "$APKSIGNER" sign             --ks dist/wlz-ci.jks             --ks-pass pass:wlzclient             --key-pass pass:wlzclient             --out dist/WLZ-Minecraft.apk             dist/WLZ-Minecraft-aligned.apk

          "$APKSIGNER" verify --verbose dist/WLZ-Minecraft.apk
          test -s dist/WLZ-Minecraft.apk

      - name: Show artifacts
        run: find dist -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WLZ-Minecraft-APK
          path: dist/WLZ-Minecraft.apk
          if-no-files-found: error
