name: Build WLZ Client

concurrency:
  group: wlz-build
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate build scripts
        run: python3 -m py_compile patch/apply.py patch/embed_minecraft.py

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q app.zip
          unzip -q tools.zip

      - name: Apply WLZ patch
        run: python3 patch/apply.py

      - name: Remove obsolete Snaplook references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/cpp/wlzclient.cpp")
          s = p.read_text()
          s = s.replace("void doSnapNow() {\n    if (g_modules[7].load() && g_lastPlayer) {\n        snapPlayer(g_lastPlayer);\n        g_snapPending.store(false);\n    }\n}\n\n", "")
          s = s.replace("    applyFullbright();\n    doSnapNow();\n}", "    applyFullbright();\n}")
          s = s.replace("    if (index==7 && on) {\n        g_snapPending.store(true);\n        doSnapNow();\n    }\n    if (index==4) applyFullbright();", "    // Snaplook index 7 is not part of the current Apollon port.\n    if (index==4) applyFullbright();")
          p.write_text(s)
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build WLZ helper
        run: |
          gradle assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload WLZ helper APK
        uses: actions/upload-artifact@v4
        with:
          name: WLZ-Helper-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Download complete Minecraft base APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p minecraft_input
          release_id="405413956"

          # Prefer a complete source APK already attached to the repository release.
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            --paginate --jq '.[] | [.name, .url] | @tsv' > /tmp/wlz-release-assets.tsv
          BASE_LINE="$(awk -F '\t' '$1 == "base.apk" || $1 == "Minecraft-base.apk" || $1 == "Minecraft.apk" || $1 == "minecraft-full.apk" || $1 ~ /^Apollon.*\.apk$/ {print; exit}' /tmp/wlz-release-assets.tsv)"

          is_full_apk() {
            python3 - "$1" <<'PY'
          import re, sys, zipfile
          try:
              with zipfile.ZipFile(sys.argv[1]) as z:
                  names = set(z.namelist())
              required = ["AndroidManifest.xml", "resources.arsc", "lib/arm64-v8a/libminecraftpe.so"]
              missing = [n for n in required if n not in names]
              if not any(n.startswith("assets/") for n in names): missing.append("assets/*")
              if not any(re.fullmatch(r"classes[0-9]*\.dex", n) for n in names): missing.append("classes*.dex")
              if missing: sys.exit(1)
          except Exception:
              sys.exit(1)
          PY
          }

          if [ -n "${BASE_LINE}" ]; then
            IFS=$'\t' read -r name api_url <<< "${BASE_LINE}"
            echo "Trying complete base asset from release: ${name}"
            curl -fL --retry 4 --retry-delay 2 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api_url}" -o /tmp/wlz-candidate.apk
            if is_full_apk /tmp/wlz-candidate.apk; then
              mv /tmp/wlz-candidate.apk minecraft_input/base.apk
            else
              echo "::warning::Release asset ${name} isn't a complete APK; trying the published source URL."
              rm -f /tmp/wlz-candidate.apk
            fi
          fi

          if [ ! -s minecraft_input/base.apk ]; then
            # Telegram post for Apollon V6.6 / MCPE 26.51 explicitly labels this
            # short link as the 64-bit APK. Link shorteners may show an HTML interstitial
            # to curl, so resolve href/meta/script URLs in a bounded, validated loop.
            SOURCE_URL="${APOLLON_V66_ARM64_URL:-https://go.linkify.ru/2Jri}"
            # Try the original v6.6 short link and both published CDN hosts
            # for the matching MCPE 26.51 64-bit download.
            printf '%s\n' "${SOURCE_URL}" \
              "https://dl6.cdn9mc.com/dl2.php?file=Apollon-Client-MCPE-26.51-64bit.apk" \
              "https://files2.cdn9mc.com/dl2.php?file=Apollon-Client-MCPE-26.51-64bit.apk" \
              > /tmp/wlz-candidates.txt
            found=0
            for depth in 1 2 3 4; do
              [ -s /tmp/wlz-candidates.txt ] || break
              : > /tmp/wlz-next-candidates.txt
              while IFS= read -r candidate_url; do
                [ -n "${candidate_url}" ] || continue
                echo "Resolving download source (hop ${depth}): ${candidate_url}"
                if ! curl -fL --retry 2 --retry-delay 2 \
                    --connect-timeout 30 --max-time 1800 \
                    --user-agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128 Safari/537.36" \
                    -e "https://t.me/" \
                    "${candidate_url}" -o /tmp/wlz-candidate.bin; then
                  continue
                fi

                if is_full_apk /tmp/wlz-candidate.bin; then
                  mv /tmp/wlz-candidate.bin minecraft_input/base.apk
                  found=1
                  break
                fi

                # Parse the interstitial (only bounded http(s) links, relative
                # links are resolved against the current URL; reject known ad hosts).
                python3 - /tmp/wlz-candidate.bin "${candidate_url}" >> /tmp/wlz-next-candidates.txt <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse, parse_qs, unquote
          import re, sys
          path, base = sys.argv[1], sys.argv[2]
          try:
              data = open(path, "rb").read(2_000_000).decode("utf-8", "ignore")
          except Exception:
              data = ""
          found = []
          class P(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  for key in ("href", "src", "content", "data-url", "data-href"):
                      value = a.get(key, "")
                      if not value: continue
                      m = re.search(r"url\s*=\s*([^;]+)", value, re.I)
                      if m: value = m.group(1).strip(" '\"")
                      for candidate in [value, unquote(value)]:
                          try:
                              u = urljoin(base, candidate)
                              parsed = urlparse(u)
                              if parsed.scheme in ("http", "https"): found.append(u)
                          except ValueError:
                              continue
          P().feed(data)
          # Some shortener pages contain malformed pseudo-URLs (for example
          # bracketed hosts or SVG namespaces); ignore those instead of aborting.
          for match in re.findall(r"""(?:https?:)?//[A-Za-z0-9._~:/?#\[\]@!$&'()*+,;=%-]+""", data):
              try:
                  found.append(urljoin(base, match))
              except ValueError:
                  continue
          for match in re.findall(r"""(?:location\.href|window\.location|document\.location)\s*=\s*['"]([^'"]+)""", data, re.I):
              try:
                  found.append(urljoin(base, match))
              except ValueError:
                  continue
          clean, seen = [], set()
          blocked = ("doubleclick.net", "googlesyndication.com", "adf.ly", "linkvertise.com", "w3.org", "cloudfront.net", "ggclicker.com")
          for u in found:
              u = u.strip(" \t\r\n'\"<>),;")
              parsed = urlparse(u)
              if parsed.scheme not in ("http", "https") or not parsed.netloc: continue
              if any(host in parsed.netloc.lower() for host in blocked): continue
              if u not in seen and len(clean) < 20:
                  seen.add(u); clean.append(u)
          print("\n".join(clean))
          PY
                rm -f /tmp/wlz-candidate.bin
              done < /tmp/wlz-candidates.txt
              [ "${found}" -eq 0 ] || break
              sort -u /tmp/wlz-next-candidates.txt > /tmp/wlz-candidates.txt
            done
            if [ "${found}" -ne 1 ]; then
              echo "::warning::Direct HTTP resolution failed; trying a browser session for the download button."
              python3 -m venv /tmp/wlz-browser-venv
              /tmp/wlz-browser-venv/bin/pip install --disable-pip-version-check -q playwright
              /tmp/wlz-browser-venv/bin/python -m playwright install --with-deps chromium
              /tmp/wlz-browser-venv/bin/python - <<'PY'
          import asyncio, os, re, shutil, sys, zipfile
          from pathlib import Path
          from urllib.parse import urlparse
          from playwright.async_api import async_playwright

          OUT = Path("minecraft_input/base.apk")
          TEMP = Path("/tmp/wlz-browser-download.bin")
          SOURCES = [
              os.environ.get("APOLLON_V66_ARM64_URL", "https://go.linkify.ru/2Jri"),
              "https://dl6.cdn9mc.com/dl2.php?file=Apollon-Client-MCPE-26.51-64bit.apk",
              "https://files2.cdn9mc.com/dl2.php?file=Apollon-Client-MCPE-26.51-64bit.apk",
          ]
          def is_full_apk(path):
              try:
                  with zipfile.ZipFile(path) as z:
                      names = set(z.namelist())
                  required = ["AndroidManifest.xml", "resources.arsc", "lib/arm64-v8a/libminecraftpe.so"]
                  return (all(x in names for x in required)
                          and any(n.startswith("assets/") for n in names)
                          and any(re.fullmatch(r"classes[0-9]*\.dex", n) for n in names))
              except Exception:
                  return False

          async def main():
              started = asyncio.get_running_loop().time()
              found = asyncio.Event()
              saved = []
              pages = []
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True, args=["--no-sandbox", "--disable-dev-shm-usage"])
                  context = await browser.new_context(
                      accept_downloads=True,
                      user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36",
                      viewport={"width": 1365, "height": 900},
                  )
                  async def on_download(download):
                      try:
                          await download.save_as(str(TEMP))
                          if is_full_apk(TEMP):
                              shutil.copyfile(TEMP, OUT)
                              print("Browser obtained and validated full APK:", download.suggested_filename, OUT.stat().st_size, flush=True)
                              found.set()
                          else:
                              print("Ignoring non-APK download:", download.suggested_filename, TEMP.stat().st_size if TEMP.exists() else 0, flush=True)
                              TEMP.unlink(missing_ok=True)
                      except Exception as exc:
                          print("Download candidate rejected:", repr(exc), flush=True)
                  def bind(page):
                      pages.append(page)
                      page.on("download", lambda d: asyncio.create_task(on_download(d)))
                      page.on("dialog", lambda dialog: asyncio.create_task(dialog.dismiss()))
                  context.on("page", bind)

                  for source in SOURCES:
                      if found.is_set() or asyncio.get_running_loop().time() - started > 900:
                          break
                      print("Browser opening:", source, flush=True)
                      page = await context.new_page()
                      try:
                          await page.goto(source, wait_until="domcontentloaded", timeout=90000)
                      except Exception as exc:
                          print("Initial navigation note:", str(exc)[:180], flush=True)
                      for hop in range(4):
                          if found.is_set() or asyncio.get_running_loop().time() - started > 900:
                              break
                          try:
                              await page.wait_for_timeout(3500)
                          except Exception:
                              pass
                          if found.is_set():
                              break
                          try:
                              candidates = await page.locator("a,button,input[type=button],input[type=submit],[role=button]").evaluate_all("""
                              els => els.map((e,i) => {
                                const text = ((e.innerText || e.value || e.getAttribute('aria-label') || '') + '').trim().replace(/\\s+/g,' ').slice(0,100);
                                const href = e.href || e.getAttribute('href') || '';
                                const onclick = e.getAttribute('onclick') || '';
                                return {i, tag:e.tagName, text, href, onclick, disabled:!!e.disabled};
                              })
                              """)
                          except Exception:
                              candidates = []
                          def score(x):
                              label=(x.get("text","") or "").strip().lower()
                              text=(label+" "+x.get("href","")+" "+x.get("onclick","")).lower()
                              host=urlparse(x.get("href","")).netloc.lower()
                              consent=label in ["deny","reject","reject all","accept all","accept","agree","i agree","allow all","adjust","consent"]
                              source_host=("cdn9mc.com" in host or "linkify.ru" in host)
                              if not source_host and not consent: return -100
                              s=0
                              if label in ["download","download apk","download file","get file"]: s+=30
                              elif any(k in text for k in ["download","get file","start download"]): s+=15
                              if source_host: s+=12
                              if consent: s+=25
                              if any(k in text for k in ["doubleclick","adservice","googlesyndication","ggclicker","advert","alibaba"]): s-=100
                              if x.get("disabled"): s-=100
                              if x.get("tag")=="BUTTON" or "button" in x.get("href","").lower(): s+=2
                              return s
                          candidates=sorted((x for x in candidates if score(x)>0),key=score,reverse=True)[:1]
                          if not candidates:
                              # Switch to the latest popup only to handle exact consent/download controls.
                              if pages:
                                  page=pages[-1]
                              await page.wait_for_timeout(1800)
                              continue
                          for item in candidates:
                              if found.is_set(): break
                              print("Trying page action:", item.get("text","")[:60], item.get("href","")[:160], flush=True)
                              try:
                                  locator=page.locator("a,button,input[type=button],input[type=submit],[role=button]").nth(item["i"])
                                  await locator.click(timeout=5000, force=True, no_wait_after=True)
                              except Exception:
                                  href=item.get("href","")
                                  if href.startswith(("http://","https://")) and any(k in href.lower() for k in ["dl2.php","download","linkify.ru"]):
                                      try: await page.goto(href,wait_until="domcontentloaded",timeout=30000)
                                      except Exception: pass
                              await page.wait_for_timeout(1800)
                          # Choose the most recently opened page after target=_blank/new-window redirects.
                          if pages:
                              page=pages[-1]
                  await browser.close()
              if not found.is_set() or not OUT.is_file():
                  raise SystemExit("Browser did not obtain a complete APK; no broken output was produced.")
          asyncio.run(main())
          PY
            fi
            if [ ! -s minecraft_input/base.apk ]; then
              echo "::error::Could not obtain a complete Apollon base APK; refusing to generate a gray-screen/crashing client."
              exit 1
            fi
          fi

          test -s minecraft_input/base.apk
          file minecraft_input/base.apk
          sha256sum minecraft_input/base.apk | tee minecraft_input/base.sha256
          unzip -tq minecraft_input/base.apk
          echo "Full base APK structure verified; continuing to final packaging."

      - name: Setup Android SDK build tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;35.0.0 platforms;android-35'

      - name: Setup Java 17 for final packaging
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare embedded Minecraft build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 patch/embed_minecraft.py --input minecraft_input --wlz-apk app/build/outputs/apk/debug/app-debug.apk --out dist/WLZ-Minecraft-unsigned.apk

          BT="$(ls -1 "${ANDROID_HOME}/build-tools" | sort -V | tail -n 1)"
          ZIPALIGN="${ANDROID_HOME}/build-tools/${BT}/zipalign"
          APKSIGNER="${ANDROID_HOME}/build-tools/${BT}/apksigner"
          AAPT2="${ANDROID_HOME}/build-tools/${BT}/aapt2"

          "${ZIPALIGN}" -P 16 -f 4 dist/WLZ-Minecraft-unsigned.apk dist/WLZ-Minecraft-aligned.apk
          keytool -genkeypair -v \
            -keystore dist/wlz-ci.jks -storepass wlzclient -keypass wlzclient \
            -alias wlz -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=WLZ Client,O=WLZ"
          "${APKSIGNER}" sign --ks dist/wlz-ci.jks --ks-pass pass:wlzclient \
            --key-pass pass:wlzclient --out dist/WLZ-Client-2.3.5.apk \
            dist/WLZ-Minecraft-aligned.apk
          "${APKSIGNER}" verify --verbose dist/WLZ-Client-2.3.5.apk

          BADGING="$("${AAPT2}" dump badging dist/WLZ-Client-2.3.5.apk)"
          printf '%s\n' "$BADGING" | grep -q "package: name='com.wlzclient.launcher'"
          unzip -tq dist/WLZ-Client-2.3.5.apk
          unzip -Z1 dist/WLZ-Client-2.3.5.apk | grep -q '^assets/'
          unzip -Z1 dist/WLZ-Client-2.3.5.apk | grep -qx 'resources.arsc'
          unzip -Z1 dist/WLZ-Client-2.3.5.apk | grep -qx 'lib/arm64-v8a/libminecraftpe.so'
          test -s dist/WLZ-Client-2.3.5.apk
          sha256sum dist/WLZ-Client-2.3.5.apk | tee dist/SHA256SUMS.txt

      - name: Show artifacts
        run: find dist -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WLZ-Client-2.3.5-APK
          path: |
            dist/WLZ-Client-2.3.5.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
