name: Build WLZ Client 2.5.5 Standalone Launcher

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/standalone-launcher.yml"
      - "patch/**"
      - "app.zip"
      - "tools.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wlz-standalone-launcher
  cancel-in-progress: true

jobs:
  build-launcher:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate patch scripts
        run: python3 -m py_compile patch/apply.py

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project
        run: |
          set -euo pipefail
          test -s app.zip
          test -s tools.zip
          unzip -q app.zip
          unzip -q tools.zip

      - name: Apply WLZ 2.5.5 launcher sources
        run: python3 patch/apply.py

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build standalone launcher
        run: |
          set -euo pipefail
          gradle assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;35.0.0 platforms;android-35"

      - name: Align, sign, and verify launcher APK
        shell: bash
        run: |
          set -euo pipefail
          BT="${ANDROID_HOME}/build-tools/35.0.0"
          mkdir -p dist
          "${BT}/zipalign" -P 16 -f 4 app/build/outputs/apk/debug/app-debug.apk dist/WLZ-Client-2.5.5-aligned.apk

          keytool -genkeypair -v \
            -keystore dist/wlz-release.jks \
            -storepass wlzclient -keypass wlzclient \
            -alias wlz -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=WLZ Client,O=WLZ"

          "${BT}/apksigner" sign \
            --ks dist/wlz-release.jks \
            --ks-pass pass:wlzclient --key-pass pass:wlzclient \
            --out dist/WLZ-Client-2.5.5.apk \
            dist/WLZ-Client-2.5.5-aligned.apk

          "${BT}/apksigner" verify --verbose dist/WLZ-Client-2.5.5.apk
          "${BT}/aapt2" dump badging dist/WLZ-Client-2.5.5.apk | tee dist/aapt-badging.txt
          "${BT}/aapt2" dump badging dist/WLZ-Client-2.5.5.apk | grep -q "package: name='com.wlzclient.launcher'"
          "${BT}/aapt2" dump xmltree dist/WLZ-Client-2.5.5.apk --file AndroidManifest.xml > dist/manifest-tree.txt
          grep -q 'com.wlz.client.WlzApplication' dist/manifest-tree.txt
          grep -q 'com.wlz.client.MainActivity' dist/manifest-tree.txt
          grep -q 'com.mojang.minecraftpe' dist/manifest-tree.txt
          unzip -tq dist/WLZ-Client-2.5.5.apk
          unzip -Z1 dist/WLZ-Client-2.5.5.apk | grep -qx 'resources.arsc'
          unzip -Z1 dist/WLZ-Client-2.5.5.apk | grep -q '^classes2*.dex$'
          sha256sum dist/WLZ-Client-2.5.5.apk | tee dist/SHA256SUMS.txt
          test -s dist/WLZ-Client-2.5.5.apk

      - name: Upload direct APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WLZ-Client-2.5.5-Standalone-APK
          path: |
            dist/WLZ-Client-2.5.5.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v2.5.5-launcher"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/WLZ-Client-2.5.5.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "${TAG}" dist/WLZ-Client-2.5.5.apk dist/SHA256SUMS.txt \
              --title "WLZ Client 2.5.5 Standalone Launcher" \
              --notes "Standalone WLZ launcher. Detects and opens Minecraft Bedrock already installed on the device; it does not bundle the Minecraft game. This build is package/signature checked by CI. Native gameplay modifications are not injected into another app's process."
          fi
